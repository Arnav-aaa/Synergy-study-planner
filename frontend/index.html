<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Synergy | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: #f4f6ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 420px;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
    }

    .logo h1 {
      color: #6c63ff;
      margin: 0;
    }

    .logo p {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    h2 {
      margin-top: 24px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0;
      font-size: 14px;
    }

    .options a {
      color: #3f51ff;
      text-decoration: none;
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #3f51ff, #8b2cff);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .signup {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }

    .signup a {
      color: #3f51ff;
      font-weight: 600;
      text-decoration: none;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #999;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .divider span {
      margin: 0 10px;
    }

    .social-buttons {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .social-btn img {
      width: 18px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <h1>Synergy</h1>
      <p>Real-Time Collaborative Study Planner</p>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to continue your study journey</p>

    <label>Email address</label>
    <input type="email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" placeholder="••••••••">

    <div class="options">
      <label>
        <input type="checkbox"> Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-primary">Sign in</button>

    <div class="signup">
      Don't have an account?
      <a href="#">Sign up for free</a>
    </div>

    <div class="divider">
      <span>Or continue with</span>
    </div>

    <div class="social-buttons">
      <button class="social-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_2013_Google.png">
        Google
      </button>

      <button class="social-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
        Facebook
      </button>
    </div>

  </div>

</body>
</html>
